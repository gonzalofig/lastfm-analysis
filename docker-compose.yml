services:
  spark-notebook:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
      - "4040:4040"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      JUPYTER_TOKEN: lastfm
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
    command:
      - bash
      - -lc
      - >
        jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --NotebookApp.token=$JUPYTER_TOKEN
        --ServerApp.root_dir=/workspace
